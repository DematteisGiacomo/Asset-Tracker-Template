# Iridium NTN fallback, using a Deutsche Telekom SIM card for both the terrestrial network and NTN.
# Requires modem firmware with Iridium NTN support.
CONFIG_APP_NTN=y

# Match prj.conf debug level for other modules (state machine LOG_DBG in ntn_module)
CONFIG_APP_NTN_LOG_LEVEL_DBG=y
# Modem NTN library ("ntn:" location-update lines)
CONFIG_NTN_LOG_LEVEL_DBG=y
# lte_lc CFUN/PDN/system mode (tag: lte_lc)
CONFIG_LTE_LINK_CONTROL_LOG_LEVEL_DBG=y

CONFIG_LTE_LC_PDN_LEGACY_PCO=y
CONFIG_LTE_LC_PDN_DEFAULTS_OVERRIDE=y
CONFIG_LTE_LC_PDN_DEFAULT_FAM_IPV4=y
CONFIG_LTE_LC_PDN_DEFAULT_APN="internet.m2mportal.de"

# The nRF Cloud CoAP session is resumed from the NTN module thread
CONFIG_COAP_CLIENT_STACK_SIZE=2048

# Without a terrestrial network there is no A-GNSS, and fixes take longer
CONFIG_LOCATION_REQUEST_DEFAULT_GNSS_TIMEOUT=180000
CONFIG_LOCATION_REQUEST_DEFAULT_TIMEOUT=240000
