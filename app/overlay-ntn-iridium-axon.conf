# Build with:
#   -DEXTRA_CONF_FILE="overlay-ntn-iridium.conf;overlay-ntn-iridium-axon.conf"
#   -DEXTRA_DTC_OVERLAY_FILE="boards/nrf9151dk_nrf9151_ns_companion.overlay"

CONFIG_COMPANION_THUMB_SIZE_1024=y

CONFIG_APP_COMPANION=y
CONFIG_APP_COMPANION_LOG_LEVEL_DBG=y
CONFIG_APP_COMPANION_THREAD_STACK_SIZE=6144

# NTN + companion: no cloud provisioning, no modem trace on UART1.
CONFIG_NRF_PROVISIONING=n

CONFIG_NRF_MODEM_LIB_TRACE=n
# CONFIG_UART_1_ASYNC is not set
CONFIG_UART_1_INTERRUPT_DRIVEN=y

CONFIG_LOG_MODE_IMMEDIATE=y


# Example — override on command line:
# CONFIG_APP_NTN_SERVER_ADDR="203.0.113.10"
# CONFIG_APP_NTN_SERVER_PORT=4567
